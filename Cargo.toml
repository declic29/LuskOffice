[package]
name = "lusk-office-setup"
version = "1.3.0"
edition = "2024"
rust-version = "1.88"
description = "Installateur de Lusk Office (Windows, Linux et Mac) : Lusk Texte, Lusk Tab, Lusk Diapo, Lusk PDF et Lusk.bzh en un seul programme"
license = "MIT OR Apache-2.0"
repository = "https://github.com/declic29/LuskOffice"
publish = false

[[bin]]
name = "LuskOfficeSetup"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "x11", "wayland", "default_fonts"] }
egui = "0.37"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[target.'cfg(not(windows))'.dependencies]
# Ouvrir un lien dans le navigateur (sous Windows, l'Explorateur s'en charge).
egui-winit = { version = "0.37", default-features = false, features = ["links"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
