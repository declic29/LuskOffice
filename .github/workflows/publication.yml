# Lusk Office : fabrique LuskOffice-Setup-Windows.exe et LuskOffice-Setup-Linux avec les
# dernières versions publiées des quatre logiciels, et les dépose dans une Release en brouillon.
#
# Les dépôts des logiciels sont publics : le jeton de l'action suffit pour lire leurs Releases.
# S'ils deviennent privés, ajouter un secret LUSK_TOKEN (jeton personnel, lecture des dépôts).
name: Publication

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.LUSK_TOKEN || github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Installateurs des quatre logiciels (dernières versions publiées)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force payload | Out-Null
          $apps = @(
            @{ key = 'tab';   repo = 'declic29/LuskTab';    file = 'Lusk-Tab-Windows.msi' },
            @{ key = 'texte'; repo = 'declic29/lusktx';     file = 'Lusk-Texte-Windows.msi' },
            @{ key = 'diapo'; repo = 'declic29/lusk-diapo'; file = 'Lusk-Diapo-Windows.msi' },
            @{ key = 'pdf';   repo = 'declic29/lusk_pdf';   file = 'Lusk-Pdf-Windows.msi' }
          )
          foreach ($a in $apps) {
            $tag = gh release view --repo $a.repo --json tagName --jq .tagName
            if (-not $tag) { throw "Aucune version publiée pour $($a.repo)" }
            gh release download $tag --repo $a.repo --pattern $a.file --dir payload --clobber
            if (-not (Test-Path "payload/$($a.file)")) { throw "$($a.file) manque dans la Release $tag de $($a.repo)" }
            "$($a.key)=$($tag.TrimStart('v'))" | Add-Content payload/versions.txt
            Write-Host "$($a.repo) $tag : $((Get-Item "payload/$($a.file)").Length) octets"
          }
          Get-Content payload/versions.txt

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Vérifications
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: Compiler
        run: cargo build --release

      - name: Fichiers à publier
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/LuskOfficeSetup.exe "dist/LuskOffice-Setup-$version-Windows.exe"
          Copy-Item target/release/LuskOfficeSetup.exe dist/LuskOffice-Setup-Windows.exe
          Copy-Item payload/versions.txt versions.txt

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/

      - uses: actions/upload-artifact@v4
        with:
          name: versions
          path: versions.txt

  linux:
    # Ubuntu 22.04 : le programme marche ensuite sur Ubuntu 22.04 et plus récent, Linux Mint 21
    # et plus récent, Debian 12 et plus récent.
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.LUSK_TOKEN || github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Paquets .deb des quatre logiciels (dernières versions publiées)
        run: |
          set -eu
          mkdir -p payload
          while read -r key repo file; do
            tag=$(gh release view --repo "$repo" --json tagName --jq .tagName)
            if [ -z "$tag" ]; then echo "Aucune version publiée pour $repo" >&2; exit 1; fi
            gh release download "$tag" --repo "$repo" --pattern "$file" --dir payload --clobber
            if [ ! -f "payload/$file" ]; then echo "$file manque dans la Release $tag de $repo" >&2; exit 1; fi
            echo "$key=${tag#v}" >> payload/versions.txt
            echo "$repo $tag : $(stat -c %s "payload/$file") octets"
          done <<'LISTE'
          tab declic29/LuskTab Lusk-Tab-Linux.deb
          texte declic29/lusktx Lusk-Texte-Linux.deb
          diapo declic29/lusk-diapo Lusk-Diapo-Linux.deb
          pdf declic29/lusk_pdf Lusk-Pdf-Linux.deb
          LISTE
          cat payload/versions.txt

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Vérifications
        # Sans les paquets (plus rapide) : ils ne changent rien au code vérifié.
        env:
          LUSK_PAYLOAD_DIR: ${{ runner.temp }}/vide
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: Compiler
        run: cargo build --release

      - name: Fichiers à publier
        run: |
          set -eu
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          mkdir -p dist
          install -m 755 target/release/LuskOfficeSetup "dist/LuskOffice-Setup-$version-Linux"
          install -m 755 target/release/LuskOfficeSetup dist/LuskOffice-Setup-Linux
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/

  publier:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: versions

      - name: Release (brouillon)
        run: |
          set -eu
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          tag="v$version"
          {
            echo "Lusk Office $version, publié par l'association Lusk."
            echo
            echo "- **Windows** : téléchargez LuskOffice-Setup-Windows.exe, ouvrez-le et cochez les logiciels à installer."
            echo "- **Linux** (Ubuntu, Linux Mint, Debian et leurs dérivées) : téléchargez LuskOffice-Setup-Linux, autorisez-le à s'exécuter (clic droit, Propriétés, « Autoriser l'exécution » ; ou \`chmod +x LuskOffice-Setup-Linux\`), puis ouvrez-le."
            echo
            echo "Versions incluses :"
            sed 's/^/- /' versions.txt
            echo "- lusk.bzh (appli web)"
          } > "$RUNNER_TEMP/notes.md"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --draft --target "$GITHUB_SHA" --title "Lusk Office $version" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          echo "Brouillon prêt : https://github.com/$GH_REPO/releases"
